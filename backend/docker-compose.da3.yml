name: da3

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata_da3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-1:
    build: .
    image: smart-parking-backend:test
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking
      SPRING_DATASOURCE_USERNAME: parking_user
      SPRING_DATASOURCE_PASSWORD: devpassword
      JWT_SECRET: this-is-a-dev-only-secret-key-change-it-before-deploying-anywhere-real
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      EMAIL_MODE: LOG
      INSTANCE_NAME: backend-1
    depends_on:
      db:
        condition: service_healthy

  backend-2:
    build: .
    image: smart-parking-backend:test
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking
      SPRING_DATASOURCE_USERNAME: parking_user
      SPRING_DATASOURCE_PASSWORD: devpassword
      JWT_SECRET: this-is-a-dev-only-secret-key-change-it-before-deploying-anywhere-real
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      EMAIL_MODE: LOG
      INSTANCE_NAME: backend-2
    depends_on:
      db:
        condition: service_healthy

  backend-3:
    build: .
    image: smart-parking-backend:test
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking
      SPRING_DATASOURCE_USERNAME: parking_user
      SPRING_DATASOURCE_PASSWORD: devpassword
      JWT_SECRET: this-is-a-dev-only-secret-key-change-it-before-deploying-anywhere-real
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      EMAIL_MODE: LOG
      INSTANCE_NAME: backend-3
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

volumes:
  pgdata_da3:
