events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        server backend-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose which backend handled the request for distribution demonstration (DA3 Q1.A)
            add_header X-Served-By $upstream_addr always;

            # Upstream failure detection & proxy retry policy (DA3 Q1.C)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
